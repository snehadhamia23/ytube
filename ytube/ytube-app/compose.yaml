services:
  ytube:
    build: .
    image: ytube:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      YTUBE_REGISTRATION_OPEN: "1"
    volumes:
      - ytube-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/app?view=home').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ytube-data:
